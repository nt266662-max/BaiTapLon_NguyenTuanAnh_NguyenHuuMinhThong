<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMART ENERGY</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--tx:#0b1f33;--mu:#6b7c93;--ln:#e3eaf2;--bl:#2563eb;--tl:#0d9488;--tl2:#14b8a6;--gn:#16a34a;--rd:#dc2626;--or:#f97316;--dk:#0b1f33;--dk2:#12324f;--sh:0 4px 14px rgba(11,31,51,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:auto;padding:12px 12px 92px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.top h1{font-size:17px;margin:0;letter-spacing:.14em}
.st{font-size:12px;color:#5eead4}.mu{color:var(--mu);font-size:12px}h3{margin:0 0 10px;font-size:15px}
button,select,input{font:inherit;color:var(--tx)}
select,input[type=number],input[type=text]{border:1px solid var(--ln);border-radius:10px;padding:8px 10px;background:#fff;width:100%;outline:none}
select:focus,input:focus{border-color:var(--tl);box-shadow:0 0 0 3px rgba(13,148,136,.15)}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btns{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;text-align:center;padding:11px;border-radius:12px;border:1px solid var(--ln);background:#fff;font-weight:600;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.98)}
.btn.dk{background:var(--dk);color:#fff;border-color:var(--dk)}
.btn.bl{background:linear-gradient(135deg,var(--tl),var(--tl2));color:#fff;border-color:var(--tl)}.btn:disabled{opacity:.45;cursor:default}
/* hero header */
.hero{background:linear-gradient(145deg,var(--dk),var(--dk2));color:#fff;border:0;border-radius:22px;padding:16px;box-shadow:0 10px 26px rgba(11,31,51,.28)}
.hero .mu{color:#9fb3c8}.hero label{color:#9fb3c8}
.hero .logo{display:flex;align-items:center;gap:10px}
.hero .lg{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--tl),var(--tl2));display:grid;place-items:center}
.hero .lg svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero select{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.18)}
.hero select option{color:#0b1f33}
.hero .btn{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.18)}
.hero .btn.dk{background:linear-gradient(135deg,var(--tl),var(--tl2));border-color:var(--tl)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.g2 .card{margin:0;cursor:pointer}.big{font-size:26px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.kpi{position:relative;overflow:hidden}
.ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;margin-bottom:8px}
.ico svg{width:18px;height:18px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.c1{background:#dbeafe}.c1 svg{stroke:#2563eb}.c2{background:#ccfbf1}.c2 svg{stroke:#0d9488}.c3{background:#ffedd5}.c3 svg{stroke:#ea580c}
.kpi.feat{background:linear-gradient(145deg,var(--dk),var(--dk2));color:#fff;border:0}
.kpi.feat .mu{color:#9fb3c8}.kpi.feat .ico{background:rgba(255,255,255,.12)}.kpi.feat .ico svg{stroke:#5eead4}
.alert{border-color:#fbd5d5;background:linear-gradient(180deg,#fff5f5,#fff);border-left:4px solid var(--rd)}.alert b{color:var(--rd)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chip{border:1px solid var(--ln);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;transition:.15s}.chip.on{background:var(--tl);color:#fff;border-color:var(--tl)}
.bar{margin:10px 0}.bar>div:first-child{display:flex;justify-content:space-between;gap:8px}.bar i{display:block;height:8px;border-radius:5px;margin-top:4px;background:linear-gradient(90deg,var(--tl),var(--tl2))}
svg{width:100%;display:block}svg text{font-size:10px;fill:var(--mu)}
.t{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:500}
tr[data-a]{cursor:pointer}tr[data-a]:hover{background:#f3f9f8}tr.best{background:#ecfdf5}.up{color:var(--rd)}.dn{color:var(--gn)}
.note{border-left:4px solid var(--or);padding:10px 12px;background:#fff;border-radius:0 12px 12px 0;margin-bottom:12px;color:var(--mu);font-size:13px;box-shadow:var(--sh)}
.best-hero{background:linear-gradient(145deg,var(--dk),var(--dk2));color:#fff;border:0}
.best-hero .mu{color:#9fb3c8}.best-hero .big{font-size:34px;color:#5eead4}
.badge{display:inline-block;background:rgba(94,234,212,.15);color:#5eead4;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;letter-spacing:.04em}
.drop{background:linear-gradient(145deg,var(--dk),var(--dk2));border:2px dashed rgba(94,234,212,.5);color:#fff}
.drop .mu{color:#9fb3c8}.drop .btn{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.18)}.drop .btn.dk{background:linear-gradient(135deg,var(--tl),var(--tl2));border-color:var(--tl)}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -4px 16px rgba(11,31,51,.06)}
nav button{flex:1;max-width:112px;border:0;background:none;padding:8px 2px 9px;color:var(--mu);font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--tl);font-weight:700}nav button.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--tl)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--dk);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;max-width:90%;display:none;z-index:9;box-shadow:0 8px 20px rgba(0,0,0,.25)}
input[type=range]{width:100%;accent-color:var(--tl)}
@media print{nav,#top .btns,#toast{display:none}}
</style>
</head>
<body>
<div id="app"><div id="top"></div><div id="main">Đang tải...</div></div>
<nav id="nav"></nav><div id="toast"></div>
<input type="file" id="file" accept=".csv,.txt" hidden>
<script>
const TABS=[["ov","Tổng quan"],["ml","Dự báo ML"],["cmp","So sánh"],["ds","Dataset"],["ai","Intelligence"]];
const ICN={ov:'<path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/>',ml:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',cmp:'<path d="M5 21V10M12 21V4M19 21v-7"/>',ds:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',ai:'<path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0012 3z"/>',bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',peak:'<path d="M3 20l6-10 4 6 3-4 5 8z"/>',tgt:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>'};
const svgI=(k,cls)=>`<svg viewBox="0 0 24 24" ${cls?`class="${cls}"`:""}>${ICN[k]}</svg>`;
const NAMES={lag_1:"Tháng trước (t-1)",lag_2:"Hai tháng trước (t-2)",lag_3:"Ba tháng trước (t-3)",lag_12:"Cùng tháng năm trước (t-12)",roll3_mean:"Trung bình 3 tháng",roll3_std:"Độ lệch chuẩn 3 tháng",month_sin:"Mùa vụ (sin tháng)",month_cos:"Mùa vụ (cos tháng)"};
const METRICS={mae:"MAE",rmse:"RMSE",mape:"MAPE %",wape:"WAPE %",r2:"R²"};
let ST=null,C={hh:{},multi:{}},GID=0;
const U={tab:"ov",sel:null,mdl:null,price:2500,range:12,seg:"one",metric:"wape",page:0,flt:"",sim:10,hist:[]};
const $=id=>document.getElementById(id),f=(x,n=1)=>x==null||isNaN(x)?"–":Number(x).toLocaleString("vi-VN",{maximumFractionDigits:n});
function save(){try{localStorage.setItem("se_pro",JSON.stringify({tab:U.tab,sel:U.sel,mdl:U.mdl,price:U.price,range:U.range,seg:U.seg,metric:U.metric,sim:U.sim,hist:U.hist}))}catch(e){}}
function restore(){try{Object.assign(U,JSON.parse(localStorage.getItem("se_pro")||"{}"))}catch(e){}}
let tt;function toast(m,keep){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(tt);if(!keep)tt=setTimeout(()=>t.style.display="none",3500)}
const hide=()=>{$("toast").style.display="none"};
async function api(u,o){const r=await fetch(u,o);if(!r.ok){let d="Lỗi";try{d=(await r.json()).detail||d}catch(e){}throw new Error(d)}return r.json()}
const models=()=>Object.keys(ST.compare);
async function hh(id){if(!C.hh[id]){try{C.hh[id]=await api("/api/household/"+encodeURIComponent(id))}catch(e){C.hh[id]={preds:{},history:[],wf:[],best:ST.best}}}return C.hh[id]}
async function multi(m){if(!C.multi[m])C.multi[m]=await api("/api/multi?model="+encodeURIComponent(m));return C.multi[m]}
function chart(lines,labels,h=190){const W=520,P=38,all=lines.flatMap(l=>l.v.filter(v=>v!=null));if(!all.length)return"";const mn=Math.min(...all)*.92,mx=Math.max(...all)*1.04,n=labels.length,X=i=>P+i*(W-P-8)/Math.max(n-1,1),Y=v=>h-22-(v-mn)/(mx-mn||1)*(h-36);
let s=`<svg viewBox="0 0 ${W} ${h}">`;for(let i=0;i<3;i++){const v=mn+(mx-mn)*i/2;s+=`<line x1="${P}" x2="${W-8}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e3eaf2"/><text x="${P-3}" y="${Y(v)+3}" text-anchor="end">${f(v,0)}</text>`}
for(let i=0;i<n;i+=Math.ceil(n/6))s+=`<text x="${X(i)}" y="${h-5}" text-anchor="middle">${labels[i]}</text>`;
lines.forEach(l=>{let d="",pen=false,first=null,last=null;l.v.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?"L":"M")+X(i)+" "+Y(v);pen=true;if(first==null)first=i;last=i});
if(l.area&&first!=null){const g="g"+(++GID);s+=`<defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${l.c}" stop-opacity=".28"/><stop offset="1" stop-color="${l.c}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${X(last)} ${h-22} L${X(first)} ${h-22} Z" fill="url(#${g})"/>`}
s+=`<path d="${d}" fill="none" stroke="${l.c}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" ${l.dash?'stroke-dasharray="5 4"':""}/>`;if(l.dot){const i=l.v.length-1;s+=`<circle cx="${X(i)}" cy="${Y(l.v[i])}" r="6" fill="#fff" stroke="${l.c}" stroke-width="3"/>`}});return s+"</svg>"}
const leg=a=>`<div class="mu" style="display:flex;gap:14px">${a.map(x=>`<span><b style="color:${x[1]}">━</b> ${x[0]}</span>`).join("")}</div>`;
const bar=(n,v,pct)=>`<div class="bar"><div><span>${n}</span><b>${v}</b></div><i style="width:${Math.max(pct,2)}%"></i></div>`;
const opts=(arr,s)=>arr.map(k=>`<option value="${k}"${k===s?" selected":""}>${k}</option>`).join("");
const curModel=h=>h.preds[U.mdl]?U.mdl:h.best;

/* ---------- Màn 1: Dashboard tổng quan ---------- */
async function ov(){const s=ST.series,r=U.range?s.slice(-U.range):s,pk=s.reduce((a,b)=>b.v>a.v?b:a),avg=s.reduce((a,b)=>a+b.v,0)/s.length;
const h=await hh(U.sel),m=curModel(h),p=h.preds[m],q=[0,0,0,0];s.forEach(x=>q[Math.floor((+x.m.slice(5,7)-1)/3)]+=x.v);const qt=q.reduce((a,b)=>a+b,0)||1,mi=Math.max(...ST.importance.map(x=>x.v));
return`<div class="g2"><div class="card kpi" data-a="tab:ds"><div class="ico c1">${svgI("bolt")}</div><div class="mu">Tổng điện năng</div><div class="big">${f(ST.total_kwh,0)}</div><div class="mu">kWh · ${ST.months} tháng</div></div>
<div class="card kpi" data-a="tab:ds"><div class="ico c2">${svgI("home")}</div><div class="mu">Trung bình mỗi hộ mỗi tháng</div><div class="big">${f(ST.avg,0)}</div><div class="mu">kWh · ${ST.n_hh} hộ</div></div>
<div class="card kpi" data-a="tab:ai"><div class="ico c3">${svgI("peak")}</div><div class="mu">Tháng cao nhất</div><div class="big">${f(pk.v,0)}</div><div class="mu">kWh · ${pk.m}</div></div>
<div class="card kpi feat" data-a="tab:ml"><div class="ico">${svgI("tgt")}</div><div class="mu">Dự đoán ${p?p.month:""} · ${U.sel}</div><div class="big">${p?f(p.pred,0):"–"}</div><div class="mu">kWh · ${m}</div></div></div>
<div class="card alert"><b>Phát hiện tháng tiêu thụ đỉnh</b><br>${pk.m} đạt ${f(pk.v,0)} kWh, gấp ${f(pk.v/avg,2)} lần mức trung bình theo tháng.<div class="btns"><button class="btn" data-a="tab:ai">Xem phân tích</button><button class="btn bl" data-a="tab:ml">Dự báo tháng tới</button></div></div>
<div class="card"><div class="top"><h3>Chuỗi tiêu thụ theo tháng (kWh)</h3></div><div class="chips">${[[12,"12 tháng"],[24,"24 tháng"],[0,"Tất cả"]].map(x=>`<button class="chip ${U.range===x[0]?"on":""}" data-a="range:${x[0]}">${x[1]}</button>`).join("")}</div>${chart([{v:r.map(x=>x.v),c:"#0d9488",area:1}],r.map(x=>x.m))}</div>
<div class="card"><h3>Phân bổ theo quý</h3>${q.map((v,i)=>bar("Quý "+(i+1),f(v,0)+" kWh · "+f(v/qt*100)+"%",v/qt*100*2)).join("")}</div>
<div class="card"><div class="top"><h3>Đặc trưng quyết định</h3><button class="chip" data-a="tab:ai">Xem thêm</button></div>${ST.importance.slice(0,4).map(x=>bar(NAMES[x.f]||x.f,x.v+"%",x.v/mi*100)).join("")}</div>`}

/* ---------- Màn 2: Dự đoán và phân tích ML ---------- */
async function ml(){if(ST.n_hh<2)U.seg="one";const seg=`<div class="chips"><button class="chip ${U.seg==="one"?"on":""}" data-a="seg:one">Một hộ</button><button class="chip ${U.seg==="many"?"on":""}" data-a="seg:many">Nhiều hộ</button></div>`;
const mchips=cur=>`<div class="chips">${models().map(n=>`<button class="chip ${n===cur?"on":""}" data-a="mdl:${n}">${n}</button>`).join("")}</div>`;
if(U.seg==="many"){const d=await multi(U.mdl);if(!d.rows||!d.rows.length)return seg+mchips(U.mdl)+`<div class="note">Chưa có hộ nào đủ dữ liệu để xếp hạng. Hãy bấm "Một hộ" hoặc nhập file có nhiều hộ.</div>`;const tp=d.rows.reduce((s,r)=>s+r.pred,0),tl=d.rows.reduce((s,r)=>s+r.last,0);
return seg+mchips(d.model)+`<div class="g2"><div class="card kpi feat"><div class="mu">Tổng dự đoán tháng tới</div><div class="big">${f(tp,0)}</div><div class="mu">kWh</div></div><div class="card kpi"><div class="mu">So với tháng gần nhất</div><div class="big ${tp>tl?"up":"dn"}">${f((tp-tl)/tl*100)}%</div></div></div>
<div class="card t"><h3>Xếp hạng các hộ (bấm một hàng để xem chi tiết)</h3><table><tr><th>Hạng</th><th>Mã hộ</th><th>Gần nhất</th><th>Dự đoán</th><th>Đổi</th></tr>${d.rows.slice(0,100).map((r,i)=>`<tr data-a="sel:${r.id}"><td>${i+1}</td><td>${r.id}</td><td>${f(r.last)}</td><td>${f(r.pred)}</td><td class="${r.change>0?"up":"dn"}">${r.change>0?"+":""}${r.change}%</td></tr>`).join("")}</table></div>`}
const h=await hh(U.sel),m=curModel(h),p=h.preds[m];
if(!p)return seg+`<div class="note">Hộ ${U.sel} chưa đủ 12 tháng lịch sử liên tục để dự đoán. Hãy chọn hộ khác.</div>`;
const hs=h.history.slice(-36),hv=hs.map(x=>x.v),ch=(p.pred-p.last)/p.last*100;
return seg+`<div class="card"><div class="two"><div><label>Giá điện (đ/kWh)</label><input type="number" id="price" data-i="price" value="${U.price}"></div><div><label>&nbsp;</label><button class="btn bl" style="width:100%" data-a="save">Lưu dự đoán</button></div></div>${mchips(m)}</div>
<div class="g2"><div class="card kpi feat"><div class="mu">Dự đoán tháng ${p.month}</div><div class="big">${f(p.pred)}</div><div class="mu">kWh</div></div><div class="card kpi"><div class="mu">So với tháng trước</div><div class="big ${ch>0?"up":"dn"}">${ch>0?"+":""}${f(ch)}%</div><div class="mu">≈ ${f(p.pred*U.price,0)} đ</div></div></div>
<div class="card"><h3>Lịch sử và dự đoán, ${U.sel} (kWh)</h3>${chart([{v:[...hv,null],c:"#2563eb",area:1},{v:[...hv.map(()=>null).slice(0,-1),hv[hv.length-1],p.pred],c:"#f97316",dash:1,dot:1}],[...hs.map(x=>x.m),p.month])}${leg([["Thực tế","#2563eb"],["Dự đoán","#f97316"]])}</div>
<div class="card t"><h3>Dự đoán theo từng mô hình (bấm để chọn)</h3><table><tr><th>Mô hình</th><th>Dự đoán (kWh)</th></tr>${Object.entries(h.preds).map(([n,x])=>`<tr data-a="mdl:${n}" class="${n===m?"best":""}"><td>${n}${n===h.best?" (tốt nhất)":""}</td><td>${f(x.pred)}</td></tr>`).join("")}</table></div>
${h.wf.length?`<div class="card"><h3>Kiểm chứng walk-forward, ${h.best} (kWh)</h3>${chart([{v:h.wf.map(x=>x.actual),c:"#2563eb"},{v:h.wf.map(x=>x.pred),c:"#f97316",dash:1}],h.wf.map(x=>x.m))}${leg([["Thực tế","#2563eb"],["Dự đoán","#f97316"]])}</div>`:""}`}

/* ---------- Màn 3: So sánh mô hình ---------- */
async function cmp(){const k=U.metric,rows=Object.entries(ST.compare),lowBad=k!=="r2",vals=rows.map(r=>r[1][k]),mx=Math.max(...vals.map(Math.abs))||1,bestV=lowBad?Math.min(...vals):Math.max(...vals);const bm=ST.compare[ST.best];
return`<div class="card best-hero"><span class="badge">MÔ HÌNH TỐT NHẤT</span><div style="font-size:18px;font-weight:700;margin:8px 0 2px">${ST.best}</div><div class="big">${bm?bm.r2:"–"}</div><div class="mu">R² · WAPE ${bm?bm.wape:"–"}% · MAE ${bm?bm.mae:"–"}</div></div>
<div class="note">Walk-forward trên ${ST.nt} tháng cuối: mỗi tháng chỉ học dữ liệu trước tháng đó rồi dự đoán tháng đó. Mô hình ML chỉ có giá trị khi tốt hơn Seasonal Naive.</div>
<div class="card"><h3>Chỉ số</h3><div class="chips">${Object.entries(METRICS).map(([a,b])=>`<button class="chip ${k===a?"on":""}" data-a="metric:${a}">${b}</button>`).join("")}</div>${rows.map(([n,m])=>`<div class="bar"><div><span>${n}${n===ST.best?" (tốt nhất)":""}</span><b ${m[k]===bestV?'class="dn"':""}>${m[k]}</b></div><i style="width:${Math.max(Math.abs(m[k])/mx*100,2)}%;background:${m[k]===bestV?"linear-gradient(90deg,#16a34a,#4ade80)":"linear-gradient(90deg,#1e3a8a,#2563eb)"}"></i></div>`).join("")}<div class="mu">${lowBad?"Càng thấp càng tốt":"Càng cao càng tốt"}</div></div>
<div class="card t"><h3>Bảng đầy đủ (bấm để dùng mô hình)</h3><table><tr><th>Mô hình</th><th>MAE</th><th>RMSE</th><th>MAPE</th><th>WAPE</th><th>R²</th></tr>${rows.map(([n,m])=>`<tr data-a="mdl:${n}" class="${n===U.mdl?"best":""}"><td>${n}${n===U.mdl?" ✓":""}</td><td>${m.mae}</td><td>${m.rmse}</td><td>${m.mape}</td><td>${m.wape}</td><td>${m.r2}</td></tr>`).join("")}</table></div>
<div class="btns"><button class="btn bl" data-a="useml:${ST.best}">Dùng mô hình tốt nhất</button><button class="btn" data-a="tab:ml">Dự báo với ${U.mdl}</button></div>`}

/* ---------- Màn 4: Dataset ---------- */
async function ds(){const q=U.flt.toLowerCase(),all=ST.rows.filter(r=>!q||r.household_id.toLowerCase().includes(q)),per=20,pages=Math.max(1,Math.ceil(all.length/per));if(U.page>=pages)U.page=pages-1;
return`<div class="card drop"><div style="font-weight:700;font-size:16px">Nhập dữ liệu</div><div class="mu" style="margin-top:4px">Nguồn hiện tại: <b style="color:#5eead4">${ST.name}</b>. Nhận file CSV có cột <b>household_id, month, kwh</b> (mỗi hộ cần khoảng 27 tháng liên tục) hoặc file TXT gốc UCI (household_power_consumption.txt).</div>
<div class="btns"><button class="btn dk" data-a="upload">Chọn file để nhập</button><button class="btn" data-a="template">Tải CSV mẫu</button></div><div class="btns"><button class="btn" data-a="reset">Dùng lại dữ liệu mặc định</button><button class="btn" data-a="refresh">Làm mới</button></div></div>
<div class="card t"><h3>Xem và lọc dữ liệu</h3><input type="text" id="flt" data-i="flt" placeholder="Lọc theo mã hộ, ví dụ HH03" value="${U.flt}"><table style="margin-top:8px"><tr><th>Mã hộ</th><th>Tháng</th><th>kWh</th></tr>${all.slice(U.page*per,U.page*per+per).map(r=>`<tr data-a="sel:${r.household_id}"><td>${r.household_id}</td><td>${r.month}</td><td>${r.kwh}</td></tr>`).join("")}</table>
<div class="top" style="margin-top:8px"><button class="chip" data-a="page:-1">Trước</button><span class="mu">Trang ${U.page+1}/${pages} · ${all.length} dòng (tối đa 500 dòng đầu)</span><button class="chip" data-a="page:1">Sau</button></div></div>`}

/* ---------- Màn 5: ML Intelligence và báo cáo ---------- */
async function ai(){const s=ST.series,mi=Math.max(...ST.importance.map(x=>x.v)),top=ST.importance[0],c=ST.compare,best=c[ST.best],nv=c["Seasonal Naive"],cal=Array.from({length:12},()=>[0,0]);s.forEach(x=>{const m=+x.m.slice(5,7)-1;cal[m][0]+=x.v;cal[m][1]++});const av=cal.map(x=>x[1]?x[0]/x[1]:0),hi=av.indexOf(Math.max(...av)),lo=av.indexOf(Math.min(...av.filter(v=>v>0)));
const h=await hh(U.sel),m=curModel(h),p=h.preds[m],imp=ST.best!=="Seasonal Naive"?(nv.wape-best.wape)/nv.wape*100:0;
return`<div class="card"><h3>Nhận định từ kết quả thật</h3><p style="margin:6px 0">• Đặc trưng ảnh hưởng nhất: <b>${NAMES[top.f]||top.f}</b> (${top.v}% theo SHAP, ${ST.tree}).</p>
<p style="margin:6px 0">• ${ST.best==="Seasonal Naive"?"Seasonal Naive đang tốt nhất, mô hình ML chưa thắng được baseline trên dữ liệu này. Hãy ghi nhận trung thực trong báo cáo.":`Mô hình tốt nhất là <b>${ST.best}</b>, WAPE ${best.wape}% so với ${nv.wape}% của Seasonal Naive (${imp>0?"giảm":"tăng"} ${f(Math.abs(imp))}% sai số tương đối).`}</p>
<p style="margin:6px 0">• Trung bình theo lịch, tháng ${hi+1} tiêu thụ cao nhất${lo>=0?` và tháng ${lo+1} thấp nhất`:""}.</p></div>
<div class="card"><div class="top"><h3>Đặc trưng quyết định (SHAP)</h3><button class="chip" data-a="tab:cmp">So sánh mô hình</button></div>${ST.importance.map(x=>bar(NAMES[x.f]||x.f,x.v+"%",x.v/mi*100)).join("")}</div>
<div class="card"><h3>Mô phỏng tiết kiệm, hộ ${U.sel}</h3><label>Giảm điện năng: <b id="simv">${U.sim}</b>%</label><input type="range" min="0" max="40" value="${U.sim}" data-r="sim"><div id="simo" class="mu" data-p="${p?p.pred:0}">${simText(p?p.pred:0)}</div></div>
<div class="card t"><div class="top"><h3>Lịch sử dự đoán đã lưu</h3><span class="mu">${U.hist.length} mục</span></div>${U.hist.length?`<table><tr><th>Hộ</th><th>Tháng</th><th>Mô hình</th><th>kWh</th><th>Tiền (đ)</th></tr>${U.hist.map(x=>`<tr data-a="sel:${x.id}"><td>${x.id}</td><td>${x.month}</td><td>${x.model}</td><td>${f(x.pred)}</td><td>${f(x.pred*x.price,0)}</td></tr>`).join("")}</table>`:`<p class="mu">Chưa có mục nào. Vào "Dự báo ML" và bấm "Lưu dự đoán".</p>`}
<div class="btns"><button class="btn bl" data-a="export"${U.hist.length?"":" disabled"}>Xuất CSV</button><button class="btn" data-a="print">In / PDF</button><button class="btn" data-a="clearhist"${U.hist.length?"":" disabled"}>Xóa lịch sử</button></div></div>`}
const simText=p=>`Tiết kiệm ước tính ${f(p*U.sim/100)} kWh, khoảng ${f(p*U.sim/100*U.price,0)} đ cho tháng tới (giá ${f(U.price,0)} đ/kWh).`;
const V={ov,ml,cmp,ds,ai};

/* ---------- Khung chung, đồng bộ trên mọi màn ---------- */
function topHtml(){return`<div class="card hero" id="top"><div class="top"><div class="logo"><div class="lg">${svgI("bolt")}</div><div><h1>SMART ENERGY</h1><span class="st">● FastAPI Online</span></div></div><span class="mu">${ST.n_hh} hộ · ${ST.months} tháng</span></div><div class="mu" style="margin-top:8px">Nguồn: ${ST.name} · ${ST.from} đến ${ST.to}</div>
<div class="two" style="margin-top:8px"><div><label>Hộ</label><select data-s="sel">${opts(ST.households,U.sel)}</select></div><div><label>Mô hình</label><select data-s="mdl">${opts(models(),U.mdl)}</select></div></div>
<div class="btns"><button class="btn dk" data-a="tab:ds">Nhập dữ liệu</button><button class="btn" data-a="upload">Tải lên UCI/CSV</button></div></div>`}
async function render(){if(!ST)return;const ae=document.activeElement,aid=ae&&ae.id,pos=ae&&ae.selectionStart;
$("top").outerHTML=topHtml();$("nav").innerHTML=TABS.map(t=>`<button class="${t[0]===U.tab?"on":""}" data-a="tab:${t[0]}">${svgI(t[0])}<span>${t[1]}</span></button>`).join("");
try{$("main").innerHTML=await V[U.tab]()}catch(e){$("main").innerHTML=`<div class="note">${e.message}</div>`}
if(aid&&$(aid)&&$(aid).tagName==="INPUT"){$(aid).focus();try{$(aid).setSelectionRange(pos,pos)}catch(e){}}save()}
function dl(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+text],{type:"text/csv"}));a.download=name;a.click()}
async function act(k,v){switch(k){
case"tab":U.tab=v;window.scrollTo(0,0);break;case"range":U.range=+v;break;case"seg":if(v==="many"&&ST.n_hh<2){U.seg="one";toast("Dữ liệu chỉ có 1 hộ. Chế độ Nhiều hộ cần file có từ 2 hộ trở lên.");break}U.seg=v;break;case"metric":U.metric=v;break;
case"mdl":U.mdl=v;break;case"useml":U.mdl=v;toast("Đã chọn mô hình "+v);break;
case"sel":U.sel=v;U.tab="ml";U.seg="one";window.scrollTo(0,0);break;
case"page":U.page=Math.max(0,U.page+(+v));break;
case"save":{const h=await hh(U.sel),m=curModel(h);if(!h.preds[m])return toast("Hộ này chưa đủ dữ liệu để dự đoán");U.hist.unshift({id:U.sel,month:h.preds[m].month,model:m,pred:h.preds[m].pred,price:U.price});toast("Đã lưu dự đoán, xem ở tab Intelligence");break}
case"clearhist":U.hist=[];break;
case"export":dl("lich_su_du_doan.csv","ma_ho,thang,mo_hinh,du_doan_kwh,tien_dien_dong\n"+U.hist.map(h=>[h.id,h.month,h.model,h.pred,Math.round(h.pred*h.price)].join(",")).join("\n"));return;
case"print":window.print();return;
case"template":dl("mau_household_month_kwh.csv","household_id,month,kwh\n"+["2022-01,310.5","2022-02,295.2","2022-03,288.9"].map(x=>"HH01,"+x).join("\n")+"\n");return;
case"upload":$("file").value="";$("file").click();return;
case"refresh":await init(true);toast("Đã làm mới");return;
case"reset":toast("Đang khôi phục dữ liệu mặc định và huấn luyện lại...",1);try{await api("/api/reset",{method:"POST"});C={hh:{},multi:{}};await init(true);toast("Đã dùng dữ liệu mặc định")}catch(e){toast(e.message)}return}
render()}
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,i=a.indexOf(":");act(i<0?a:a.slice(0,i),i<0?"":a.slice(i+1))});
document.addEventListener("change",e=>{const s=e.target.dataset.s,i=e.target.dataset.i;if(s){U[s]=e.target.value;render()}else if(i==="price"){U.price=Math.max(1,+e.target.value||2500);render()}});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.i==="flt"){U.flt=t.value;U.page=0;render()}else if(t.dataset.r==="sim"){U.sim=+t.value;$("simv").textContent=U.sim;const o=$("simo");o.textContent=simText(+o.dataset.p);save()}});
$("file").addEventListener("change",async e=>{const fl=e.target.files[0];if(!fl)return;toast("Đang xử lý "+fl.name+" và huấn luyện lại 4 mô hình (có thể mất vài phút)...",1);
const fd=new FormData();fd.append("file",fl);try{await api("/api/upload",{method:"POST",body:fd});C={hh:{},multi:{}};U.sel=null;U.mdl=null;U.page=0;await init(true);toast("Đã nhập dữ liệu và cập nhật tất cả màn hình")}catch(x){toast("Lỗi: "+x.message)}});
async function init(keep){try{ST=await api("/api/state");C={hh:{},multi:{}};if(!ST.households.includes(U.sel))U.sel=ST.households[0];if(ST.n_hh<2)U.seg="one";if(!models().includes(U.mdl))U.mdl=ST.best;await render()}catch(e){$("main").textContent="Không kết nối được backend: "+e.message}}
restore();init();
</script>
</body>
</html>
